name: waka Readme

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update Readme With Metrics
    runs-on: ubuntu-latest
    steps:
      # Since 2026-11-01 WakaTime API keys are write-only (plugins only).
      # Everything that *reads* stats must authenticate with a personal OAuth
      # access token, so the WAKATIME_API_KEY secret has to hold the token from
      # https://wakatime.com/oauth -- not the API key shown in Account Settings.
      - name: Verify WakaTime OAuth token
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          if [ -z "${WAKATIME_API_KEY}" ]; then
            echo "::error::Secret WAKATIME_API_KEY is empty. Add your personal OAuth access token from https://wakatime.com/oauth ."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${WAKATIME_API_KEY}" \
            https://api.wakatime.com/api/v1/users/current || true)
          echo "WakaTime auth check returned HTTP ${code}"
          if [ "${code}" = "401" ]; then
            echo "::error::WakaTime rejected the token with 401. WAKATIME_API_KEY must be a personal OAuth access token from https://wakatime.com/oauth (API keys no longer work for reading stats)."
            exit 1
          fi

      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_OS: "True"
          SHOW_PROJECTS: "False"
          SHOW_DAYS_OF_WEEK: "False"
          SHOW_COMMIT: "False"
